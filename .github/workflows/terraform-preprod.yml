name: Terraform Preprod

on:
  pull_request:
    branches:
      - main
    paths:
      - 'environments/preprod/**'
      - 'modules/**'

  push:
    branches:
      - main
    paths:
      - 'environments/preprod/**'
      - 'modules/**'

  workflow_dispatch:

permissions:
  id-token: write
  contents: read
  pull-requests: write

jobs:

  terraform-plan:
    name: Terraform Plan
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: environments/preprod

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_bdb45ccb-8071-4cb2-baab-27ba6e261894
                     }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan


  terraform-apply:
    name: Terraform Apply
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: environments/preprod

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_a7ad17a4-efea-488f-aa85-8a4153fab3c6 }}
          tenant-id: ${{ secrets.AZURE_023fb05c-56eb-40e7-a4dc-761a0f360913 }}
          subscription-id: ${{ secrets.AZURE_bdb45ccb-8071-4cb2-baab-27ba6e261894 }}
 

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan -out=tfplan

      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan